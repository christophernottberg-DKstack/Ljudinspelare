<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f43f5e" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Microphone capsule -->
  <g filter="url(#glow)">
    <rect x="208" y="112" width="96" height="176" rx="48" fill="url(#primary)" />
    <!-- Capsule mesh lines -->
    <path d="M224 160h64 M224 192h64 M224 224h64" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.4" />
  </g>

  <!-- Mic cradle arc -->
  <path d="M168 232v24c0 48.6 39.4 88 88 88s88-39.4 88-88v-24" fill="none" stroke="#f43f5e" stroke-width="18" stroke-linecap="round" />

  <!-- Base stand & foot -->
  <path d="M256 344v64 M196 408h120" fill="none" stroke="#f43f5e" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Audio wave dots -->
  <circle cx="120" cy="244" r="10" fill="#fb7185" opacity="0.6" />
  <circle cx="392" cy="244" r="10" fill="#fb7185" opacity="0.6" />
</svg>
